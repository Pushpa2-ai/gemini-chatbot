<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot</title>
    <style>
        body {
            font-size: 16px;
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 20px auto;
            padding: 0 10px;
        }
        input, button {
            font-size: 16px;
        }
        #chat-history {
            border: 1px solid #ccc;
            padding: 10px;
            min-height: 300px;
            height: calc(100vh - 330px);
            margin-bottom: 15px;
            overflow-y: auto;
            background-color: #fff;
        }
        #control-panel {
            margin-top: 0.5rem;
            display: flex;
            gap: 10px;
        }
        .message {
            max-width: 75%;
            margin: 10px 0;
            padding: 10px 14px;
            border-radius: 12px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .user {
            background-color: #0b5ed7;
            color: white;
            margin-left: auto;
            text-align: left;
        }
        .model {
            background-color: #e9ecef;
            color: black;
            margin-right: auto;
        }
        input[type="text"] {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }
        input[type="text"]::placeholder {
            font-size: 0.9rem;
            color: #888;
        }
        button {
            padding: 8px 15px;
            cursor: pointer;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
        }
        button:hover {
            background-color: #0056b3;
        }
        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        #status {
            color: #555;
            font-size: 0.9rem;
            margin-top: 5px;
        }
        #header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        body.dark {
        background-color: #121212;
        color: white;
        }

        body.dark #chat-history {
            background-color: #1e1e1e;
            border-color: #444;
        }

        body.dark .user {
            background-color: #0d47a1;
            color: white;
        }

        body.dark .model {
            background-color: #333;
            color: white;
        }

        body.dark input {
            background-color: #222;
            color: white;
            border: 1px solid #555;
        }

        body.dark button {
            background-color: #444;
        }

        body.dark button:hover {
            background-color: #666;
        }
    </style>
</head>
<body>
    <div id= "header">
        <h1>Chatbot</h1>
        <button id="theme-toggle" onclick="toggleTheme()">🌙 </button>
    </div>
    <div id="chat-history"></div>
    <input type="text" id="message-input" placeholder="Type your message..." aria-label="Message input">
    <div id="control-panel">
        <button id="send-button" onclick="sendMessage()" aria-label="Send message">Send</button>
        <button id="reset-button" onclick="resetChat()" aria-label="Reset chat">Reset Chat</button>
        <button onclick="downloadChat()">Download Chat</button>
    </div>
    <div id="status"></div>

    <script>
        // Update status message
        function setStatus(message) {
            document.getElementById('status').textContent = message;
        }

        // Fetch and display conversation history
        async function fetchMessages() {
            try {
                const response = await fetch('/messages');
                if (!response.ok) throw new Error('Failed to fetch messages');
                const messages = await response.json();
                const chatHistory = document.getElementById('chat-history');
                chatHistory.innerHTML = '';
                messages
                .filter(msg => msg.parts[0]?.text) // Show only the text part, exclude functionCall and functionResponse
                .forEach(msg => {
                    const div = document.createElement('div');
                    div.className = `message ${msg.role}`;

                    const text = document.createElement("div");
                    text.textContent = `${msg.role}: ${msg.parts[0].text}`;
                    const time = document.createElement("small");
                    time.style.display = "block";
                    time.style.marginTop = "5px";
                    time.style.opacity = "0.7";
                    time.textContent = new Date().toLocaleTimeString([], {
                        hour: "2-digit",
                        minute: "2-digit"
                    });
                    div.appendChild(text);
                    div.appendChild(time);

                    if (msg.role === "model") {
                        const copyBtn = document.createElement("button");
                        copyBtn.textContent = "📋 Copy";
                        copyBtn.style.marginTop = "8px";

                        copyBtn.onclick = async () => {
                            await navigator.clipboard.writeText(msg.parts[0].text);
                            copyBtn.textContent = "✅ Copied";
                            setTimeout(() => {
                                copyBtn.textContent = "📋 Copy";
                            }, 1500);
                        };

                        div.appendChild(copyBtn);
                    }
                    chatHistory.appendChild(div);
                });
                chatHistory.scrollTop = chatHistory.scrollHeight;
                setStatus('');
            } catch (error) {
                setStatus('Error: Could not load messages. Is the server running?');
            }
        }

        // Send a new message
        async function sendMessage() {
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            if (!text) {
                setStatus('Please enter a message.');
                return;
            }

            input.disabled = true;
            document.getElementById('send-button').disabled = true;
            document.getElementById('reset-button').disabled = true;
            setStatus('🤖 Gemini is thinking...');

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text })
                });
                if (!response.ok) throw new Error('Failed to send message');
                input.value = '';
                await fetchMessages();
                document.getElementById("chat-history").scrollTop = document.getElementById("chat-history").scrollHeight;
            } catch (error) {
                setStatus('Error: Could not send message. Try again.');
            } finally {
                input.disabled = false;
                document.getElementById('send-button').disabled = false;
                document.getElementById('reset-button').disabled = false;
                setStatus('');
            }
        }

        // Reset chat history
        async function resetChat() {
            const confirmReset = confirm("Are you sure you want to clear the chat?");
             if (!confirmReset) return;
            try {
                const response = await fetch('/messages', { method: 'DELETE' });
                if (!response.ok) throw new Error('Failed to reset chat');
                await fetchMessages();
                setStatus('Chat history cleared.');
            } catch (error) {
                setStatus('Error: Could not reset chat. Try again.');
            }
        }

        // Download chat
        function downloadChat() {
            const messages = document.querySelectorAll(".message");
            let content = "";

            messages.forEach(message => {
                content += message.innerText + "\n\n";
            });

            const blob = new Blob([content], { type: "text/plain" });
            const url = URL.createObjectURL(blob);

            const a = document.createElement("a");
            a.href = url;
            a.download = "chat-history.txt";
            a.click();

            URL.revokeObjectURL(url);
        }

        // Dark mode
        function toggleTheme() {
            document.body.classList.toggle("dark");

            const btn = document.getElementById("theme-toggle");

            if (document.body.classList.contains("dark")) {
                btn.textContent = "☀️";
            } else {
                btn.textContent = "🌙";
            }
        }

        // Initial load of messages
        fetchMessages();

        // Allow sending message with Enter key
        document.getElementById('message-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
